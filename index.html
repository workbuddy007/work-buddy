    color:var(--ink);min-height:100vh;

  }

  .ph-wrap{max-width:none;margin:0;width:100%;height:100vh;overflow:hidden;display:flex;flex-direction:column;}



  /* ===== 顶部表头 ===== */

  .ph-header{

    height:92px;display:flex;align-items:center;margin:0;padding:0;

    background:var(--bean);border:none;border-radius:0;box-shadow:none;

  }

  .ph-date{display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer;flex:0 0 auto;padding-left:16px;padding-right:14px;}

  .ph-year{font-size:11px;color:var(--bean-deep);line-height:1.1;font-weight:400;}

  .ph-month-row{display:flex;align-items:baseline;gap:1px;}

  .ph-month{font-size:30px;font-weight:700;color:var(--bean-deep);line-height:1;}

  .ph-month-unit{font-size:12px;color:var(--bean-deep);font-weight:400;margin-left:1px;}

  .ph-caret{font-size:11px;color:var(--bean-deep);margin-left:4px;opacity:.92;}

  .ph-divider{width:1px;height:34px;background:rgba(31,60,35,.28);margin:0 6px;flex:0 0 auto;}

  .ph-stats{flex:1 1 auto;display:flex;justify-content:space-between;align-items:center;padding-left:18px;padding-right:22px;}

  .ph-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* 顶部「收入」统计整体右移 0.8mm */
  .ph-stats .ph-stat:first-child{transform:translateX(0.8mm);}

  .ph-stat-label{font-size:12px;color:rgba(31,60,35,.82);margin-bottom:3px;font-weight:500;}

  .ph-stat-val{font-size:22px;font-weight:700;color:var(--bean-deep);line-height:1;font-variant-numeric:tabular-nums;}



  /* ===== 流水区 ===== */

  .ph-flow{

    flex:1 1 auto;background:var(--glass);backdrop-filter:blur(16px);

    border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);

    margin:0;padding:0;overflow-y:auto;

  }

  .ph-flow-body{padding:0 0 40px;}

  .ph-empty{text-align:center;color:#8a9a8a;padding:80px 20px;font-size:15px;line-height:1.9;}

  .ph-empty span{font-size:13px;color:#a9b6a9;}



  .ph-day{display:flex;align-items:baseline;justify-content:space-between;padding:5px 18px 4px;}

  .ph-day-l{font-size:14px;font-weight:500;color:var(--ink-mid);}

  .ph-day-l small{font-size:14px;font-weight:400;color:#6a8a72;margin-left:5px;}

  .ph-day-r{font-size:12px;color:#6a8a72;display:flex;justify-content:flex-end;gap:4px;position:relative;}

  .ph-day-r b{font-weight:400;}

  /* 收入:0 右偏移约 1cm，支出保持原位 */
  .ph-day-r .r-inc{width:auto;text-align:right;flex:0 0 auto;white-space:nowrap;margin-left:20px;transform:translateX(1cm);}
  .ph-day-r .r-exp{width:72px;text-align:right;flex:0 0 auto;white-space:nowrap;}
  .ph-day-r .i,.ph-day-r .e{color:var(--ink-mid);}



  /* 流水行 — 紧凑高度（padding 缩减、图标缩小） */

  .ph-row{display:flex;align-items:center;gap:6px;padding:4px 18px;border-bottom:1px solid rgba(31,60,35,0.08);cursor:pointer;position:relative;}

  .ph-row:active{background:rgba(62,99,75,.04);}

  /* 条目图标 — 弹窗用 CAT_PNG 真实截图；列表用 SVG 线条图标（确保可见） */

  .ph-ico{width:36px;height:36px;border-radius:50%;background-color:#f0f1ee;

    display:flex;align-items:center;justify-content:center;flex:0 0 auto;

    box-shadow:0 1px 2px rgba(31,60,35,.05);overflow:hidden;

    background-size:cover;background-position:center;background-repeat:no-repeat;box-sizing:border-box;}

  .ph-ico svg{width:22px;height:22px;stroke:#4a4a4a;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  /* 备注区：左侧备注 + 右侧时间（时间对齐表头「收入」位置） */

  .ph-row-mid{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:space-between;}

  .ph-row-note{font-size:13px;color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;line-height:1;}

  /* 时间列：绝对定位，运行时对齐表头「收入」文字左边缘（由 JS 设置 left/top） */

  .ph-row-time{position:absolute;font-size:10px;color:#7d8c7c;width:60px;text-align:left;flex:0 0 auto;font-variant-numeric:tabular-nums;line-height:1;}

  .ph-row-amt{font-size:14px;font-weight:400;width:72px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--ink-mid);}



  /* ===== 通用遮罩 ===== */

  .mask{position:fixed;inset:0;background:rgba(20,35,22,.28);display:none;z-index:40;}

  .mask.show{display:block;}



  /* ===== 滚轮选择弹窗（月份） ===== */

  .ph-wheel-card{position:absolute;left:0;right:0;bottom:0;width:100%;

    background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);

    border-top:1px solid rgba(62,99,75,.25);

    border-radius:0;padding:0;padding-bottom:env(safe-area-inset-bottom);

    box-shadow:0 -2px 12px rgba(62,99,75,.08);}

  .ph-wheel-top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid rgba(62,99,75,.08);}

  .ph-wheel-top .t{font-size:16px;font-weight:500;color:#3E634B;position:absolute;left:50%;transform:translateX(-50%);}

  .ph-wheel-top button{background:none;border:none;font-size:15px;font-weight:400;cursor:pointer;color:#3E634B;padding:4px 8px;}

  .ph-wheel-top .ok{color:#3E634B;font-weight:400;}

  .ph-wheels{display:flex;height:216px;position:relative;overflow:hidden;}

  .ph-wheels::before,.ph-wheels::after{

    content:"";position:absolute;left:0;right:0;height:1px;

    background:rgba(62,99,75,.3);pointer-events:none;z-index:2;}

  .ph-wheels::before{top:50%;margin-top:-36px;}

  .ph-wheels::after{top:50%;margin-top:36px;}

  .ph-col{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center;

    padding:72px 0;-webkit-overflow-scrolling:touch;

    scrollbar-width:none;-ms-overflow-style:none;}

  .ph-col::-webkit-scrollbar{display:none;}

  .ph-col-item{

    height:72px;line-height:72px;font-size:19px;font-weight:400;color:#749981;opacity:.85;

    scroll-snap-align:center;cursor:pointer;white-space:nowrap;

    border-bottom:1px solid rgba(62,99,75,.12);position:relative;

  }

  .ph-col-item:last-child{border-bottom:none;}

  .ph-col-item.active{color:#3E634B;opacity:1;font-weight:400;font-size:19px;}



  /* ================================================================

     ==========  鲨鱼记账风格 · 分类选择弹窗  ==========

     ================================================================ */

  /* 分类选择弹窗（点击条目空白区域：全页分类页面） */

  .cat-mask{position:fixed;inset:0;background:#fff;z-index:80;

    display:none;opacity:0;transition:opacity .2s;}

  .cat-mask.show{display:block;opacity:1;}

  .cat-sheet{position:absolute;inset:0;width:100%;height:100%;max-width:none;

    background:#fff;display:flex;flex-direction:column;

    overflow-y:auto;box-sizing:border-box;}

  /* 全页顶部栏（标题 + 关闭） */

  .cat-topbar{position:sticky;top:0;background:#fff;z-index:2;height:54px;

    display:flex;align-items:center;justify-content:center;

    font-size:17px;font-weight:600;color:#333;border-bottom:1px solid #f1f1f1;}

  /* 选中态（编辑已有条目时高亮当前分类） */

  .cat-circle-sel{box-shadow:0 0 0 2px #73A968;background-color:#eef3ea;}



  /* 关闭按钮（右上角，非黄色栏） */

  .cat-close{position:absolute;top:12px;right:14px;width:34px;height:34px;

    display:flex;align-items:center;justify-content:center;

    font-size:26px;line-height:1;color:#999;cursor:pointer;z-index:3;}



  /* 分区：支出 / 收入（左上角标题 + 4 列图标） */

  .cat-section{padding:8px 4px 4px 10px;box-sizing:border-box;}

  .cat-sec-title{font-size:15px;font-weight:600;color:#333;text-align:left;

    padding:0 4px 10px;display:none;}



  /* 4 列圆圈图标网格（使用真实截图图标） */

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 0;box-sizing:border-box;}

  .cat-cell{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;

    padding:4px 0;box-sizing:border-box;}

  .cat-circle{width:62px;height:62px;border-radius:50%;background-color:#f0f1ee;

    background-size:cover;background-position:center;background-repeat:no-repeat;

    display:block;transition:background-color .15s;box-sizing:border-box;}

  .cat-cell:active .cat-circle{background-color:#e3e1d8;}

  .cat-circle.no-hl{filter:grayscale(0.85) brightness(1.05);}

  .cat-label{font-size:13px;color:#888;font-weight:400;white-space:nowrap;}

  /* 参考图原图 + 点击覆盖层 */
  .ref-icon-img-wrap{position:relative;width:100%;grid-column:1/-1;overflow:visible;}
  .ref-icon-img-wrap > img{max-width:84%;margin:0;display:block;}
  /* 半页弹窗（catSheet 快速选择 / beEdit 编辑面板）图标缩小至一半 */
  .catSheet-scroll .ref-icon-img-wrap > img,
  .be-top .ref-icon-img-wrap > img{max-width:42%;}
  .ref-click-zone{position:absolute;cursor:pointer;z-index:10;box-sizing:border-box;}
  .ref-click-zone:active{background:rgba(115,169,104,0.15);border-radius:8px;}
  .ref-sheet-wrap{margin:0;overflow:visible;}

  /* 生活费：线条房子图标（对齐截图：房子形状） */

  .cat-circle-line{display:flex;align-items:center;justify-content:center;}

  .cat-circle-line svg{width:34px;height:34px;stroke:#4a4a4a;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}



  /* 底部安全区 */



  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);

    background:rgba(40,55,45,.92);color:#fff;font-size:13px;padding:9px 16px;

    border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;}

  .toast.show{opacity:1;}



  /* ===== 底部导航栏 ===== */

  .ph-tabbar{display:flex;align-items:flex-end;justify-content:center;gap:0;

    height:56px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

    border-top:1px solid var(--hair);flex-shrink:0;position:relative;padding-bottom:env(safe-area-inset-bottom);

  /* 文字标签（图表/储蓄）— 左右分别对齐上方「08」和「结余」 */

  .ph-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;

  .ph-tab .lbl{font-size:11px;color:#73A968;opacity:.5;line-height:1;}

  .ph-tab.active{color:#73A968;}

  .ph-tab.active .lbl{color:#73A968;opacity:1;}

  /* 中间圆形加号按钮 — 对齐截图：白半圆缺口(仅半圆有白边) + 抹茶绿正圆 + 记账标签可见 */

  .ph-tab-add{position:absolute;left:50%;transform:translateX(-50%);top:-27px;

    display:flex;flex-direction:column;align-items:center;z-index:5;}

  /* 白色半圆缺口（仅此半圆有"套边"，圆本身无白边） */

  .ph-tab-add::before{content:'';display:block;width:62px;height:31px;

    background:#fff;border-radius:62px 62px 0 0;

    box-sizing:border-box;flex-shrink:0;}

  /* 圆形按钮本体 — 抹茶绿，无额外白边/白圈 */

  .ph-tab-add-circle{width:54px;height:54px;border-radius:50%;background:#73A968;color:#fff;

    display:flex;align-items:center;justify-content:center;box-sizing:border-box;

    box-shadow:0 3px 10px rgba(115,169,104,.45);border:none;flex-shrink:0;

    margin-top:-28px;position:relative;z-index:2;}

  .ph-tab-add-circle svg{width:26px;height:26px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;}

  /* "记账"文字标签 — 圆下方清晰可见 */

  .ph-tab-add .lbl{font-size:11px;color:#73A968;line-height:1;margin-top:4px;}



  /* ================================================================

     ==========  下半页金额输入弹窗（鲨鱼记账风格）  ==========

     ================================================================ */

  .amt-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;

    display:none;opacity:0;transition:opacity .25s;}

  .amt-mask.show{display:block;opacity:1;}

  .amt-sheet{position:absolute;bottom:0;left:0;right:0;

    background:#fff;border-radius:16px 16px 0 0;

    max-height:70vh;display:flex;flex-direction:column;

    animation:amtUp .3s ease-out;box-sizing:border-box;

    box-shadow:0 -4px 24px rgba(0,0,0,.12);}

  @keyframes amtUp{from{transform:translateY(100%);}to{transform:translateY(0);}}



  /* 金额显示区 */

  .amt-header{padding:16px 20px 8px;display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;}

  .amt-display{font-size:16px;font-weight:400;color:#333;line-height:1;

    font-variant-numeric:tabular-nums;min-width:80px;text-align:right;}



  /* 备注输入 — 独占一行全宽 */

  .amt-row{padding:4px 20px 8px;}

  .amt-remark{width:100%;height:40px;border:1px solid #e8e8e8;border-radius:8px;

    padding:0 12px;font-size:14px;color:#999;background:#f7f7f7;

    outline:none;box-sizing:border-box;-webkit-appearance:none;}

  .amt-remark::placeholder{color:#bbb;}

  .amt-remark:focus{border-color:#ccc;background:#fff;}



  /* 日期键（在键盘网格内） */

  .amt-key.date-key{font-size:14px;color:#333;font-weight:400;gap:2px;}

  .amt-key.date-key svg{width:18px;height:18px;stroke:#666;fill:none;

    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}



  /* 数字键盘区 */

  .amt-keypad{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;font-family:inherit;

    grid-template-rows:1fr 1fr 1fr 1fr;gap:1px;background:#eee;margin:0 2px 2px;

    border-radius:0 0 14px 14px;overflow:hidden;}

  .amt-key{display:flex;align-items:center;justify-content:center;

    font-size:20px;color:#333;background:#fff;cursor:pointer;

    -webkit-user-select:none;user-select:none;

    -webkit-tap-highlight-color:transparent;transition:background .1s;

    min-height:52px;font-weight:400;}

  .amt-key:active{background:#e8e8e8;}

  .amt-key.op{color:#73A968;font-size:20px;font-weight:500;}

  .amt-key.del{color:#555;}

  .amt-key.del svg{width:22px;height:22px;stroke:currentColor;fill:none;

    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* 完成按钮 — 抹茶绿（工作台主题） */

  /* 分类选择半屏弹窗（仅分类图标，点选即时生效） — 截图鲨鱼记账风格 */

    display:none;opacity:0;transition:opacity .22s;}

  /* ================================================================

     ==========  滚轮式日期选择弹窗（居中浮层）  ==========

  .dp-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;

  .dp-mask.show{display:block;opacity:1;}

  @keyframes dpIn{from{opacity:0;transform:translate(-50%,-48%);}to{opacity:1;transform:translate(-50%,-50%);}}

  .dp-head{display:flex;align-items:center;justify-content:space-between;

    padding:14px 18px;border-bottom:1px solid #eee;}

  .dp-cancel,.dp-confirm{background:none;border:none;font-size:15px;cursor:pointer;

    padding:4px 6px;-webkit-tap-highlight-color:transparent;}

  .dp-cancel{color:#888;}

  .dp-confirm{color:#73A968;font-weight:500;}

  .dp-title{font-size:16px;font-weight:500;color:#333;position:absolute;left:50%;

    transform:translateX(-50%);}

  .dp-body{display:flex;height:200px;position:relative;padding:8px 0;}

  /* 选中行指示线 */

  .dp-body::before{content:'';position:absolute;left:12px;right:12px;top:50%;

    height:1px;background:#ddd;z-index:2;transform:translateY(-.5px);}

  .dp-col{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center;

    padding:66px 0;-webkit-overflow-scrolling:touch;

    scrollbar-width:none;-ms-overflow-style:none;}

  .dp-col::-webkit-scrollbar{display:none;}

  .dp-item{height:44px;line-height:44px;font-size:18px;color:#aaa;

    scroll-snap-align:center;cursor:pointer;white-space:nowrap;font-weight:400;}

  .dp-item.sel{color:#222;font-weight:700;font-size:19px;}



  /* ================================================================

     ==========  账单编辑弹窗（对半拆分 / 完整编辑 · 嫩黄绿主题 · 无玻璃）  ==========

     ================================================================ */

  .be-mask{position:fixed;inset:0;background:rgba(31,60,35,.42);z-index:120;display:none;opacity:0;transition:opacity .22s;}

  .be-mask.show{display:block;opacity:1;}

  .be-sheet{position:absolute;left:0;right:0;bottom:0;height:92vh;display:flex;flex-direction:column;

    background:#EAF4DC;border-radius:18px 18px 0 0;overflow:hidden;

    box-shadow:0 -6px 26px rgba(31,60,35,.22);animation:beUp .28s ease-out;}

  @keyframes beUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

  /* 上半区：分类选择（嫩黄绿实底，无玻璃） */

  .be-top{flex:1 1 50%;background:var(--bean);overflow-y:auto;padding:12px 6px 8px;box-sizing:border-box;}

  .be-title{font-size:15px;font-weight:600;color:var(--bean-deep);text-align:center;margin:2px 0 8px;}

  .be-sec-title{font-size:13px;font-weight:600;color:rgba(31,60,35,.72);padding:6px 12px 4px;display:none;}

  .be-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;}

  .be-cell{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 0;-webkit-tap-highlight-color:transparent;}

  .be-circle{width:58px;height:58px;border-radius:50%;background-color:#f0f1ee;

    background-size:cover;background-position:center;background-repeat:no-repeat;

    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(31,60,35,.10);

    box-sizing:border-box;transition:transform .12s, box-shadow .12s;}

  .be-cell.sel .be-circle{box-shadow:0 0 0 3px var(--hi), 0 2px 6px rgba(31,60,35,.22);transform:scale(1.05);}

  .be-circle svg{width:32px;height:32px;stroke:#4a4a4a;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}

  .be-catlabel{font-size:12px;color:var(--bean-deep);font-weight:500;}

  .be-cell.sel .be-catlabel{color:#10331a;}

  /* 下半区：编辑区（白底） */

  .be-bottom{flex:1 1 50%;background:#fff;overflow-y:auto;padding:10px 18px;box-sizing:border-box;}

  .be-field{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid rgba(31,60,35,.08);}

  .be-field:last-child{border-bottom:none;}

  .be-field-label{font-size:14px;color:#3E634B;font-weight:600;flex:0 0 auto;width:60px;}

  .be-field-input{flex:1;border:none;outline:none;font-size:17px;color:#2c3e2e;text-align:right;

    background:transparent;font-variant-numeric:tabular-nums;-webkit-appearance:none;}

  .be-field-input::placeholder{color:#b6c2b6;}

  .be-date-btn{font-size:17px;color:#3E634B;font-weight:600;background:none;border:none;cursor:pointer;

    font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:8px;-webkit-tap-highlight-color:transparent;}

  .be-date-btn:active{background:rgba(162,197,121,.20);}

  /* 底部：取消 / 保存 */

  .be-foot{display:flex;height:56px;flex-shrink:0;border-top:1px solid rgba(31,60,35,.12);}

  .be-foot button{flex:1;border:none;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}

  .be-cancel{background:#eef2e6;color:#5a7a5e;}

  .be-save{background:var(--bean);color:#10331a;}

  .be-cancel:active{background:#e3e9d8;}

  .be-save:active{background:#92b869;}



  /* 日期滚轮需盖在编辑弹窗之上 */

  .dp-mask{z-index:140;}

</style>

</head>

<script>

/* ===== 鲨鱼风格分类图标（圆圈内使用的线性图标，复刻鲨鱼记账） ===== */

function CI(p){ return '<svg viewBox="0 0 24 24">'+p+'</svg>'; }



/* ===== 分类图标 — 严格对照鲨鱼记账截图 1:1 复刻 ===== */

var CAT_ICONS = {

  /* ── 支出 ── */



  /* 餐饮：左勺子(椭圆碗+弧柄) 右叉子(4齿+弧柄) — 对齐用户参考图 */

  food: CI('<g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">'

    +'<!-- 勺子：椭圆碗 -->'

    +'<ellipse cx="8" cy="9" rx="4" ry="5.5"/>'

    +'<!-- 勺柄 -->'

    +'<path d="M8 14.5v5"/>'

    +'<!-- 叉子：四齿 -->'

    +'<path d="M17 3v5M15 3v5M19 3v5M21 3v5"/>'

    +'<!-- 叉柄弧线 -->'

    +'<path d="M17 8a3 3 0 0 0 6 0"/>'

    +'<!-- 叉柄 -->'

    +'<path d="M20 11v8.5"/>'

    +'</g>'),



  /* 购物：梯形购物袋+双提手 — 截图支出第1行第2个 */

  shop: CI('<g stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">'

    +'<!-- 袋体（上宽下窄梯形） -->'

    +'<path d="M6 9h12l-1.5 11H7.5z"/>'

    +'<!-- 双提手 -->'

    +'<path d="M9 9V6.5a2.5 2.5 0 0 1 5 0V9"/>'

/* ===== 渲染表头 ===== */

function renderHeader(){

  $('phYear').textContent=view.y+'年'; $('phMonth').textContent=pad(view.m);

  $('phInc').textContent=sum('inc').toFixed(2); $('phExp').textContent=sum('exp').toFixed(2);

  $('phBal').textContent=(sum('inc')-sum('exp')).toFixed(2);

}



/* ===== 渲染流水（行可点击打开分类弹窗） ===== */

function renderFlow(){

  var body=$('phFlowBody');

  if(records.length===0){

    body.innerHTML='<div class="ph-empty">还没有记账记录<br><span>点击任意流水即可查看与编辑</span></div>';

    return;

  }

  var groups={};

  records.forEach(function(r){ var k=r.date.y+'-'+r.date.m+'-'+r.date.d; (groups[k]=groups[k]||[]).push(r); });

  var keys=Object.keys(groups).sort(function(a,b){return b>a?1:-1});

  var html='';

  keys.forEach(function(k){

    var arr=groups[k], parts=k.split('-'), y=+parts[0],m=+parts[1],d=+parts[2];

    var di=arr.filter(function(r){return r.type==='inc'}).reduce(function(s,r){return s+r.amount;},0);

    var de=arr.filter(function(r){return r.type==='exp'}).reduce(function(s,r){return s+r.amount;},0);

    /* 小计逻辑：仅收入→收入小计，仅支出→支出小计，两者都有→都显示 */
    var dayRight='';
    if(di>0 && de===0) dayRight='<span class="r-inc"><span class="r-inc-label">收入: </span><b class="i">'+money(di)+'</b></span><span class="r-exp"></span>';
    else if(de>0 && di===0) dayRight='<span class="r-inc"></span><span class="r-exp"><span class="r-exp-label">支出: </span><b class="e">'+money(de)+'</b></span>';
    else dayRight='<span class="r-inc"><span class="r-inc-label">收入: </span><b class="i">'+money(di)+'</b></span><span class="r-exp"><span class="r-exp-label">支出: </span><b class="e">'+money(de)+'</b></span>';

    html+='<div class="ph-day"><div class="ph-day-l">'+m+'月'+d+'日<small>星期'+week(y,m,d)+'</small></div>'

        +'<div class="ph-day-r">'+dayRight+'</div></div>';

    arr.sort(function(a,b){return(b.time||'').localeCompare(a.time||'');}).forEach(function(r){

      /* 支出金额前加负号，收入不加+号 */

      var sign=(r.type==='exp'&&r.amount>0)?'−':'';

      /* 列表图标：统一使用 SVG 线性图标 */

      var icoSrc = CAT_ICON_PNG[r.cat] || '';
      var icoHtml = icoSrc ? '<img src="'+icoSrc+'" style="width:100%;height:100%;object-fit:contain;display:block;border-radius:50%;">' : '';

      html+='<div class="ph-row" data-id="'+r.id+'" data-type="'+r.type+'" data-cat="'+r.cat+'" data-remark="'+(r.remark||'')+'">'

          +'<span class="ph-ico">'+icoHtml+'</span>'

          +'<div class="ph-row-mid"><div class="ph-row-note">'+(r.remark||'')+'</div>'

          +'<span class="ph-row-time">'+(r.time||'')+'</span></div>'

          +'<div class="ph-row-amt">'+sign+money(r.amount)+'</div></div>';

    });

  });

  body.innerHTML=html;



  // 时间列严格对齐顶部表头「收入」文字左边缘（同一竖线，左边界完全对齐）

  (function alignTimeToIncome(){

    // 目标：顶部统计栏第一个「收入」标签文字的真实左边界

    var incLabel = document.querySelector('.ph-stat-label'); /* 第一个 = 收入 */

    if(!incLabel) return;

    var Linc = incLabel.getBoundingClientRect().left;

    body.querySelectorAll('.ph-row-time').forEach(function(t){

      var rowEl = t.closest('.ph-row');

      if(!rowEl) return;

      var Lrow = rowEl.getBoundingClientRect().left;

      t.style.left = (Linc - Lrow) + 'px';   // 时间文字左边界 = 「收入」文字左边界

      t.style.top = '50%';

      t.style.transform = 'translateY(-50%)';

    });

  })();




  // （.ph-day-r 设了 position:relative 作为参照）



  // 行点击：分类图标 → 半屏分类选择弹窗（仅分类，点选即时生效自动关闭）；其余空白 → 记账录入弹窗

  body.querySelectorAll('.ph-row').forEach(function(row){

    var recId=row.getAttribute('data-id');

    var ico=row.querySelector('.ph-ico');

    if(ico){

      ico.addEventListener('click', function(e){

        e.stopPropagation();

        openCatSheet(recId);

      });

    }

    row.addEventListener('click', function(){

      openCatFullPage(recId);

    });

  });

}

var catPickerCtx = { recId: null };

function openCatFullPage(recId){

  catPickerCtx.recId = recId || null;

  /* 编辑已有条目时高亮当前分类 */

  var sel = null;

  if(catPickerCtx.recId){ var r = findRec(catPickerCtx.recId); if(r) sel = r.cat; }

  /* 支出区：裁切支出部分（8图标）— 不添加绿色描边，保持与参考图一致 */
  var expZones = CLICK_ZONES_EXP.map(function(z){

  }).join('');
  $('catGridExp').innerHTML = '<div class="ref-icon-img-wrap"><img src="'+REF_EXP+'" style="width:100%;display:block">'+expZones+'</div>';

  /* 收入区：裁切收入部分（4图标）— 不添加绿色描边，保持与参考图一致 */

/* 点击分类 → 打开金额输入弹窗 */

function bindCatClick(el){

  el.addEventListener('click', function(e){

    var cell=e.target.closest('.cat-cell') || e.target.closest('.ref-click-zone'); if(!cell) return;

    var n=cell.getAttribute('data-n');

    var k=cell.getAttribute('data-k');

    if(k==='gp'){ showToast('跳转分类管理页（演示）'); return; }

    /* 判断收入/支出 */

    var type = 'exp';

    for(var i=0;i<INC_CATS.length;i++){ if(INC_CATS[i].k===k){ type='inc'; break; } }

    $('catMask').classList.remove('show');

    if(catPickerCtx.recId){

      /* 编辑已有条目：写入分类后打开该条目编辑弹窗（金额/备注/日期） */

      var rec = findRec(catPickerCtx.recId);

      if(rec){ rec.cat=k; rec.type=type; renderFlow(); renderHeader(); }

      openAmtForRecord(catPickerCtx.recId);

    } else {

      openAmtModal(type, k, n);

    }

  });

}



/* ===== 滚轮选择（月份） ===== */

function openWheel(title, cols, sel, onOk){

  wheel.title=title; wheel.cols=cols; wheel.vals=sel.slice(); wheel.onOk=onOk;

  $('phWheelTitle').textContent=title;

  var wrap=$('phWheels'); wrap.innerHTML='';

  cols.forEach(function(col, ci){

    var colEl=document.createElement('div'); colEl.className='ph-col';

    colEl.innerHTML=col.items.map(function(it){

      var active=(it.v===wheel.vals[ci])?' active':'';

      return '<div class="ph-col-item'+active+'" data-v="'+it.v+'">'+it.label+'</div>';

    }).join('');

    var items=colEl.querySelectorAll('.ph-col-item');

    items.forEach(function(it){

      it.addEventListener('click', function(){

        wheel.vals[ci]=+it.getAttribute('data-v');

        items.forEach(function(x){x.classList.remove('active');});

        it.classList.add('active');

        colEl.scrollTop=it.offsetTop-(colEl.clientHeight/2)+(it.clientHeight/2);

      });

    });

    colEl._raf=null;

    colEl.addEventListener('scroll', function(){

      if(colEl._raf) return;

      colEl._raf=requestAnimationFrame(function(){

        colEl._raf=null;

        var idx=Math.round(colEl.scrollTop/72);

        idx=Math.max(0, Math.min(items.length-1, idx));

        var target=items[idx]; if(!target) return;

        wheel.vals[ci]=+target.getAttribute('data-v');

        items.forEach(function(x){x.classList.toggle('active', x===target);});

      });

    });

    wrap.appendChild(colEl);

    var act=colEl.querySelector('.active');

    if(act){ colEl.scrollTop=act.offsetTop-(colEl.clientHeight/2-act.clientHeight/2); }

  });

  $('phWheelMask').classList.add('show');

}

var amtState = { val: '', type: 'exp', cat: '', catName: '', date: new Date() };



function fmtDate(d){

  var y=d.getFullYear(), m=pad(d.getMonth()+1), day=pad(d.getDate());

  return y+'/'+m+'/'+day;

}

/* 日期按钮显示：📅 今天 或 📅 MM/DD */

function setAmtDateBtn(d){

  var today = new Date();

  var isToday = d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate();

  var label = isToday ? '今天' : pad(d.getMonth()+1)+'/'+pad(d.getDate());

  $('amtDateBtn').innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 2v4M16 2v4"/></svg> '+label;

}



function catNameOf(k){

  var all=EXP_CATS.concat(INC_CATS);

  for(var i=0;i<all.length;i++){ if(all[i].k===k) return all[i].n; }

  if(k==='gp') return '游戏';

  return k;

}

function nowTime(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }

/* 点击流水空白区：以已有账单数据预填记账录入弹窗 */

function openAmtForRecord(recId){

  var rec=findRec(recId); if(!rec) return;

  openAmtModal(rec.type, rec.cat, catNameOf(rec.cat), recId);

}



function openAmtModal(type, cat, catName, recId){

  var rec = recId ? findRec(recId) : null;

  if(rec){

    amtState = { recId:recId, val:String(rec.amount), type:rec.type, cat:rec.cat,

      catName:catName||catNameOf(rec.cat), date:new Date(rec.date.y,rec.date.m-1,rec.date.d) };

  } else {

    amtState = { recId:null, val:'', type:type||'exp', cat:cat||'', catName:catName||'', date:new Date() };

  }

  updateAmtDisplay();

  $('amtRemark').value = rec ? (rec.remark||'') : '';

  setAmtDateBtn(amtState.date);

  $('amtMask').classList.add('show');

}



function closeAmtModal(){

  $('amtMask').classList.remove('show');

}



/* 更新金额显示 */

function updateAmtDisplay(){

  var v = amtState.val;

  if(!v || v==='0' || v==='.') { $('amtDisplay').textContent='0.00'; return; }

  /* 确保最多两位小数 */

  if(v.indexOf('.')!==-1){ var parts=v.split('.'); if(parts[1]&&parts[1].length>2) parts[1]=parts[1].slice(0,2); v=parts[0]+'.'+parts[1]; }

  amtState.val = v;

  $('amtDisplay').textContent = (amtState.type==='inc'?'+':'') + (parseFloat(v)||'0.00');

}



/* 数字键盘点击 */

$('amtKeypad').addEventListener('click', function(e){

  var k = e.target.closest('.amt-key'); if(!k) return;

  var d = k.getAttribute('data-k');

  if(d==='del'||d==='del2'){

    amtState.val = amtState.val.slice(0,-1);

    updateAmtDisplay(); return;

  }

  if(d==='+'){ amtState.type='inc'; return; }

  if(d==='-'){ amtState.type='exp'; return; }

  /* 数字或小数点 */

  if(d==='.'){

    if(amtState.val.indexOf('.')!==-1) return;

    if(!amtState.val) amtState.val='0';

    amtState.val += '.';

  } else {

    if(amtState.val==='0') amtState.val=d;

    else amtState.val += d;

    /* 限制总长度（含小数点） */

    if(amtState.val.replace('.','').length>10) amtState.val=amtState.val.slice(0,-1);

  }

  updateAmtDisplay();

});



/* 完成按钮：确认保存（编辑已有账单则更新，新增则创建） */

$('amtDone').addEventListener('click', function(){

  var amount = parseFloat(amtState.val);

  if(!amount || amount<=0){ showToast('请输入有效金额'); return; }

  var remark = $('amtRemark').value.trim();

  if(amtState.recId){

    /* 编辑已有账单 */

    var rec=findRec(amtState.recId);

    if(rec){

      rec.amount=amount; rec.type=amtState.type; rec.remark=remark;

      rec.date={y:amtState.date.getFullYear(), m:amtState.date.getMonth()+1, d:amtState.date.getDate()};

    }

    renderFlow(); renderHeader();

    showToast('已保存');

  } else {

    /* 新增账单（底部 + 号流程） */

    var nid='r'+Date.now();

    records.unshift({id:nid, type:amtState.type, amount:amount, cat:amtState.cat, remark:remark,

      date:{y:amtState.date.getFullYear(), m:amtState.date.getMonth()+1, d:amtState.date.getDate()},

      time:nowTime()});

    renderFlow(); renderHeader();

    showToast((amtState.type==='inc'?'收入':'支出')+' ¥'+amount.toFixed(2));

  }

  closeAmtModal();

});



/* 点击遮罩关闭 */

$('amtMask').addEventListener('click', function(e){

  if(e.target===this) closeAmtModal();

});



/* ================================================================

   ==========  分类选择半屏弹窗（点击图标：仅选分类，即时生效）  ==========

   ================================================================ */

var catSheetRecId=null;

var catSheetType='exp';

function openCatSheet(recId){

  catSheetRecId=recId;

  var rec=findRec(recId);

  catSheetType = rec? rec.type : 'exp';

  renderCatSheet();

  $('catSheetMask').classList.add('show');

}

function closeCatSheet(){ $('catSheetMask').classList.remove('show'); catSheetRecId=null; }

/* 渲染底部分类面板（线性 SVG 图标，造型与参考图一致） */

function renderCatSheet(){
  var scroll=$('catSheetScroll');
  var zones = CLICK_ZONES_FULL.map(function(z){
    return '<div class="ref-click-zone" data-k="'+z.k+'" data-n="'+z.n+'" style="left:'+z.l+'%;top:'+z.t+'%;width:'+z.w+'%;height:'+z.h+'%"></div>';
  }).join('');
  scroll.innerHTML = '<div class="ref-icon-img-wrap ref-sheet-wrap"><img src="'+REF_FULL+'" style="width:100%;display:block">'+zones+'</div>';
  scroll.querySelectorAll('.ref-click-zone').forEach(function(zone){
    zone.addEventListener('click', function(){
      var k=this.getAttribute('data-k');
      var type='exp';
      for(var i=0;i<INC_CATS.length;i++){ if(INC_CATS[i].k===k){ type='inc'; break; } }
      var rec=findRec(catSheetRecId);
      if(rec){ rec.cat=k; rec.type=type; renderFlow(); renderHeader(); }
      closeCatSheet();
    });
  });
}

/* 点击弹窗以外空白区域：关闭，不保存（本弹窗点选即生效，未点选则无改动） */

$('catSheetMask').addEventListener('click', function(e){

  if(e.target===this) closeCatSheet();

});



/* ================================================================

   ==========  日期选择器（滚轮式）  ==========

   ================================================================ */

var dpSel = { y:0, m:0, d:0 }; // 索引

var dpCb = null;               // 日期选择确认回调



function openDatePicker(initDate, onConfirm){

  dpCb = onConfirm || null;

  var now = initDate || amtState.date;

  dpSel.y = now.getFullYear();

  dpSel.m = now.getMonth() + 1;

  dpSel.d = now.getDate();



  var body = $('dpBody'); body.innerHTML = '';



  /* 年列：前后各5年 */

  var years = [], sy = dpSel.y - 2;

  for(var i=sy;i<=sy+5;i++) years.push(i);

  /* 月列：1-12 */

  var months = []; for(var j=1;j<=12;j++) months.push(j);

  /* 日列：1-31 */

  var days = []; for(var k=1;k<=31;k++) days.push(k);



  var cols = [years, months, days];

  var names = ['y','m','d'];

  var sels = [dpSel.y, dpSel.m, dpSel.d];



  cols.forEach(function(items, ci){

    var colEl = document.createElement('div'); colEl.className = 'dp-col';

    items.forEach(function(val){

      var sel = (val===sels[ci])?' sel':'';

      colEl.innerHTML += '<div class="dp-item'+sel+'" data-v="'+val+'" data-ci="'+ci+'">'+(ci===1?pad(val):''+val)+'</div>';

    });

    body.appendChild(colEl);



    /* 滚动吸附 + 高亮选中行 */

    colEl._items = colEl.querySelectorAll('.dp-item');

    colEl._raf = null;

    colEl.addEventListener('scroll', function(){

      if(colEl._raf) return;

      colEl._raf = requestAnimationFrame(function(){

        colEl._raf = null;

        var idx = Math.round(colEl.scrollTop / 44);

        idx = Math.max(0, Math.min(colEl._items.length-1, idx));

        var target = colEl._items[idx];

        if(!target) return;

        var v = +target.getAttribute('data-v');

        dpSel[names[ci]] = v;

        colEl._items.forEach(function(x){ x.classList.toggle('sel', x===target); });

      });

    });



    /* 滚到选中项 */

    var act = colEl.querySelector('.sel');

    if(act) colEl.scrollTop = act.offsetTop - (colEl.clientHeight/2 - act.clientHeight/2);

  });



  $('dpMask').classList.add('show');

}



function closeDatePicker(){

  $('dpMask').classList.remove('show');

}



/* 取消 */

$('dpCancel').addEventListener('click', closeDatePicker);

$('dpMask').addEventListener('click', function(e){

  if(e.target===this) closeDatePicker();

});



/* 确定 */

$('dpConfirm').addEventListener('click', function(){

  var d = new Date(dpSel.y, dpSel.m-1, dpSel.d);

  if(dpCb){ dpCb(d); } else { amtState.date = d; setAmtDateBtn(d); }

  closeDatePicker();

});



/* 点击日期文字打开选择器 */

$('amtDateBtn').addEventListener('click', function(e){

  e.stopPropagation();

  openDatePicker(amtState.date, function(d){ amtState.date=d; setAmtDateBtn(d); });

});



/* ================================================================

   ==========  账单编辑弹窗（对半拆分 / 完整编辑）  ==========

   ================================================================ */

var beState = null; // {mode:'split'|'full', recId, cat, type, amount, remark, date}



function findRec(id){

  for(var i=0;i<records.length;i++){ if(records[i].id===id) return records[i]; }

  return null;

}



/* 渲染编辑弹窗内分类网格（线性 SVG 图标，造型与参考图一致） */

function renderBeImg(zones, imgSrc){
  var zHtml = zones.map(function(z){
    var sel=(beState && beState.cat===z.k)?' sel':'';
    return '<div class="ref-click-zone'+sel+'" data-k="'+z.k+'" data-n="'+z.n+'" style="left:'+z.l+'%;top:'+z.t+'%;width:'+z.w+'%;height:'+z.h+'%"></div>';
  }).join('');
  return '<div class="ref-icon-img-wrap"><img src="'+imgSrc+'" style="width:100%;display:block">'+zHtml+'</div>';
}
function renderBeCats(){
  var expEl=$('beCatExp'), incEl=$('beCatInc');
  expEl.innerHTML='<div class="be-sec-title">支出"></div>'+renderBeImg(CLICK_ZONES_EXP, REF_EXP);
  incEl.innerHTML='<div class="be-sec-title">收入"></div>'+renderBeImg(CLICK_ZONES_INC, REF_INC);
  [expEl,incEl].forEach(function(sec){
    sec.querySelectorAll('.ref-click-zone').forEach(function(zone){
      zone.addEventListener('click', function(){
        onBeCatPick(this.getAttribute('data-k'), this.getAttribute('data-n'));
      });
    });
  });
}



/* 点击分类图标 */

function onBeCatPick(k, n){

  var type='exp';

  for(var i=0;i<INC_CATS.length;i++){ if(INC_CATS[i].k===k){ type='inc'; break; } }

  beState.cat=k; beState.type=type;

  if(beState.mode==='split'){

    /* 上半区：即时生效 → 更新本条账单分类 + 实时刷新流水列表 */

    var rec=findRec(beState.recId);

    if(rec){ rec.cat=k; rec.type=type; }

    renderFlow(); // 实时刷新流水列表（图标/类型立即变化）

  }

  renderBeCats(); // 更新高亮

}



/* 打开编辑弹窗：split=图标点击（分类即时），full=空白点击（整体暂存） */

function openBillEdit(recId, mode){

  var rec=findRec(recId); if(!rec) return;

  beState={mode:mode||'full', recId:recId, cat:rec.cat, type:rec.type,

    amount:rec.amount, remark:rec.remark||'',

    date:{y:rec.date.y,m:rec.date.m,d:rec.date.d}, time:rec.time};

  $('beTitle').textContent=(mode==='split')?'选择分类':'编辑账单';

  $('beAmount').value=(rec.amount)?money(rec.amount):'';

  $('beRemark').value=rec.remark||'';

  $('beDateBtn').textContent=rec.date.y+'/'+pad(rec.date.m)+'/'+pad(rec.date.d);

  renderBeCats();

  $('beMask').classList.add('show');

}



/* 保存：下半区（金额/备注/日期）生效；完整模式连分类一并生效 */

$('beSave').addEventListener('click', function(){

  if(!beState) return;

  var rec=findRec(beState.recId); if(!rec) return;

  var amt=parseFloat($('beAmount').value);

  if(isNaN(amt)||amt<=0){ showToast('请输入有效金额'); return; }

  rec.amount=amt;

  rec.remark=$('beRemark').value.trim();

  rec.date={y:beState.date.y,m:beState.date.m,d:beState.date.d};

  if(beState.mode==='full'){ rec.cat=beState.cat; rec.type=beState.type; }

  renderFlow(); renderHeader();

  $('beMask').classList.remove('show');

});



/* 取消：丢弃下半区编辑；已即时变更的分类保留不变（split 模式） */

$('beCancel').addEventListener('click', function(){

  $('beMask').classList.remove('show');

  beState=null;

});



/* 编辑弹窗内日期按钮：打开滚轮选择，写入 beState.date */

$('beDateBtn').addEventListener('click', function(e){

  e.stopPropagation();

  openDatePicker(new Date(beState.date.y, beState.date.m-1, beState.date.d), function(d){

    beState.date={y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate()};

    $('beDateBtn').textContent=d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());

  });

});

</script>
